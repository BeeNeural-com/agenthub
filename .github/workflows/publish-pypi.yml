# Publish agenthub + agenthub-mcp to PyPI via Trusted Publishing (OIDC).
# No API tokens — configure pending publishers on https://pypi.org first.
#
# Prerequisites:
#   1. GitHub Environment named `pypi` on BeeNeural-com/agenthub
#      (Settings → Environments → New environment → name: pypi)
#   2. Two pending publishers on PyPI (one per project), matching:
#        Owner: BeeNeural-com
#        Repository name: agenthub
#        Workflow name: publish-pypi.yml
#        Environment name: pypi
#
# Trigger: publish a GitHub Release, or run this workflow manually (Actions → workflow_dispatch).

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build & publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: agenthub
            path: packages/python/agenthub
          - package: agenthub-mcp
            path: packages/python/agenthub-mcp
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.path }}/dist
