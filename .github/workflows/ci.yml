name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -e packages/python/agenthub -e packages/python/agenthub-mcp

      - name: Run Python tests
        env:
          AGENTHUB_CATALOG_PATH: packages/python/agenthub/tests/fixtures/sample-catalog
        run: |
          python -m unittest discover -s packages/python/agenthub/tests -p "test_*.py" -v
          python -m unittest discover -s packages/python/agenthub-mcp/tests -p "test_*.py" -v

  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/npm/mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install, build, test
        run: |
          npm install
          npm run build
          npm test

  npm-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/npm/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build SDK (depends on local @agenthub-mcp/mcp)
        run: |
          npm install --prefix ../mcp
          npm run build --prefix ../mcp
          npm install
          npm run build
