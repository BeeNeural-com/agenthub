[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthub-mcp"
version = "0.1.0"
description = "Agent Hub MCP server — connect coding agents to skills, agents, rules, prompts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "agenthub>=0.1.0",
  "mcp>=1.2,<2",
  "pyyaml>=6.0",
]

[project.scripts]
agenthub-mcp = "agenthub_mcp.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
